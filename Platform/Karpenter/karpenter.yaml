apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: public.ecr.aws/karpenter
    chart: karpenter
    targetRevision: 1.15.0
    helm:
      values: |
        settings:
          clusterName: "myapp-eks"
          interruptionQueue: "myapp-eks-karpenter-interruption-queue"
          enableZonalShift: "false"
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: "arn:aws:iam::216545191382:role/myapp-eks-karpenter-controller-role"

        controller:
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
            requests:
              cpu: "1"
              memory: "1Gi"
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true