apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker

spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker

  template:
    metadata:
      name: worker
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: dockersamples/examplevotingapp_worker
          ports:
            - containerPort: 80
              name: worker
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
